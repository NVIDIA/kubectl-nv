# Kubernetes-native YAML, the shape "kubectl get nodes -o yaml" prints and
# gpu-operator's hack/must-gather.sh writes: json field names, and quantities
# as the strings the API serves.
apiVersion: v1
kind: List
metadata:
  resourceVersion: ""
