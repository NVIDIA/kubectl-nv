# GitHub reads this file when it generates release notes from the pull requests
# merged since the previous tag. GoReleaser asks for those notes on every tag
# (changelog.use: github-native in .goreleaser.yaml), so this file is what
# groups a release page.
#
# Categories are matched top down and the first match wins, which is why
# "Other changes" carries "*" and sits last: a pull request that matched none
# of the categories above still appears. The labels are documented in
# RELEASING.md together with the one time commands that create them.

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - maintenance
    - title: Other changes
      labels:
        - "*"
