name: Docs

on:
  workflow_call: {}
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - release-*

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # '3.5' only ever resolved to 3.5.0-preview1: the series was released
          # as 4.0, and ubuntu-26.04 has no build of the preview. '4.0' follows
          # the latest 4.0.x, which ruby-builder ships for 26.04.
          ruby-version: '4.0'

      - name: Install mdl
        run: gem install mdl -v 0.13.0

      - name: Run Markdown lint
        run: |
          find docs/ -path docs/vendor -prune -false -o -name '*.md' | xargs mdl -s docs/mdl-style.rb
