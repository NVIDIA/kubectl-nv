#
# Breaks a Mokka lane on purpose, one finding code at a time, and checks that
# `kubectl nv health` reports each break and goes quiet when it is undone.
#
# It is a second job and not another leg of e2e Mokka because the two lanes
# make opposite promises: that one asserts a lane nobody touched reports
# nothing, this one asserts a lane somebody broke reports it. Sharing a lane
# would make the healthy gate depend on the recovery of whatever ran before it.
#
# One profile and not a matrix. These tests are about the rules, which read
# labels, pods and the ClusterPolicy; nothing in them varies with the number of
# simulated devices per node, so a second profile would be a second half hour
# for no second answer. t4, which is the smallest lane that still has two
# workers to tell apart.
#
# Every action is pinned to a commit, not to a tag: a tag is moved by whoever
# owns the action, and this job has a checkout of the pull request and a Docker
# daemon in reach.

name: e2e faults

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - release-*
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-faults-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faults:
    name: injected faults on a t4 lane
    runs-on: ubuntu-latest
    # A cold run pulls the node image, the nvml-mock chart and the GPU Operator
    # images on two workers before the suite starts, and the suite itself then
    # waits out an inject and a recover per finding code.
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job reads the pull request's own code and runs it. It has no
          # reason to hold a credential that can write to the repository.
          persist-credentials: false

      - name: Get Golang version
        id: go_version
        run: |
          GOLANG_VERSION=$(./hack/golang-version.sh)
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION := }" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go_version.outputs.GOLANG_VERSION }}

      - name: Install kind
        env:
          # The release the Mokka node image's base, kindest/node:v1.35.0, is
          # built and tested against.
          KIND_VERSION: v0.31.0
          # The digest of that release's linux-amd64 binary, written out here
          # rather than fetched. A checksum file downloaded next to the binary
          # it describes is signed by nothing and served by whoever served the
          # binary, so it cannot witness for it; this line is reviewed, and a
          # binary that stops matching it stops the job.
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "${workdir}"
          curl -fsSLo kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          # The binary creates the cluster everything after it trusts, so it is
          # checked before it is installed, not after.
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      - name: Report the runner's disk and memory
        run: |
          df -h
          free -m

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned rather than "latest": the lane scripts are verified against
          # this release, and a helm that changes under them turns an unrelated
          # pull request red.
          version: v4.3.0

      - name: Run the fault suite against its own lane
        env:
          # The lane's own waits have to fit inside timeout-minutes with room
          # for the suite:
          #
          #   2 x 12m helm                              24m
          #   2 x 300s ready                            10m
          #   runner setup, kind create, image pulls    about 5m
          #   the fault suite, worst case               up to 50m
          #   teardown and the diagnostics dump         about 5m
          #                                            -----
          #                                             94m   against 100m
          #
          # The 50 minutes is what the suite's own -timeout allows and not what
          # it takes: eight injections, each waiting at most 2 minutes for a
          # finding to appear and 3 for it to clear, against a measured worst
          # case of 11 seconds and 58 seconds on a t4 lane. A healthy run is
          # four minutes.
          #
          # The job's timeout is above the suite's on purpose. A Go test that
          # hits its own timeout panics and prints every goroutine, which names
          # the wait that hung; a job killed by the runner first prints
          # nothing, and the lane is gone by the time anyone looks.
          MOKKA_HELM_TIMEOUT: 12m
          MOKKA_READY_TIMEOUT: "300"
        run: make e2e-faults

      # The lane is deleted by the make target as soon as the suite returns, so
      # the pod list, the node YAML, the events and the kind logs are collected
      # by that target while the cluster is still up. This step only ships what
      # it left behind. hack/mokka/bin holds the lane's kubeconfig and is never
      # uploaded.
      - name: Upload the diagnostics of a failed lane
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-faults-diagnostics
          path: bin/e2e-diagnostics-faults/
          if-no-files-found: warn
          retention-days: 7
