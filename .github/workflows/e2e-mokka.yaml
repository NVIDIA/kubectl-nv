#
# Runs the end to end suite against a Mokka lane: a kind cluster of simulated
# GPU nodes with the GPU Operator on top. It is the only job that exercises the
# built binary against a live API server, so a change that passes the unit
# tests and still breaks a real gather is caught here.
#
# Every action is pinned to a commit, not to a tag: a tag is moved by whoever
# owns the action, and this job has a checkout of the pull request and a Docker
# daemon in reach.

name: e2e Mokka

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - release-*
  workflow_dispatch: {}

permissions:
  contents: read

# A push that supersedes an earlier one cancels its lanes. Each job holds a
# kind cluster and two helm installs for the better part of half an hour, and
# a queue of runs for commits nobody is waiting on any more pays for all of it.
concurrency:
  group: e2e-mokka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mokka:
    name: must-gather on a ${{ matrix.profile }} lane
    runs-on: ubuntu-latest
    # A cold run pulls the node image, the nvml-mock chart and the GPU Operator
    # images on two workers before the suite starts.
    timeout-minutes: 50
    strategy:
      # One profile failing says something about that profile. The other one
      # still has to run, or the report cannot say whether it is the profile or
      # the change.
      fail-fast: false
      matrix:
        profile:
          - gb300
          - t4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job reads the pull request's own code and runs it. It has no
          # reason to hold a credential that can write to the repository.
          persist-credentials: false

      - name: Get Golang version
        id: go_version
        run: |
          GOLANG_VERSION=$(./hack/golang-version.sh)
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION := }" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.go_version.outputs.GOLANG_VERSION }}

      - name: Install kind
        env:
          # The release the Mokka node image's base, kindest/node:v1.35.0, is
          # built and tested against.
          KIND_VERSION: v0.31.0
          # The digest of that release's linux-amd64 binary, written out here
          # rather than fetched. A checksum file downloaded next to the binary
          # it describes is signed by nothing and served by whoever served the
          # binary, so it cannot witness for it; this line is reviewed, and a
          # binary that stops matching it stops the job.
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "${workdir}"
          curl -fsSLo kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          # The binary creates the cluster everything after it trusts, so it is
          # checked before it is installed, not after.
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      - name: Report the runner's disk and memory
        run: |
          df -h
          free -m

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned rather than "latest": the lane scripts are verified against
          # this release, and a helm that changes under them turns an unrelated
          # pull request red.
          version: v4.3.0

      - name: Run the e2e suite against a Mokka lane
        env:
          MOKKA_PROFILE: ${{ matrix.profile }}
          # The lane's own waits have to fit inside timeout-minutes with room
          # to spare, or the job is killed mid-install and reports a timeout
          # instead of whichever wait actually ran out.
          #
          # up.sh can spend, worst case, one helm timeout on nvml-mock, another
          # on the GPU Operator, and one ready timeout each on the operand
          # rollout and on the lane assertions:
          #
          #   2 x 12m helm        24m
          #   2 x 300s ready      10m
          #   runner setup, kind create, image pulls   about 5m
          #   suite, teardown and the diagnostics dump about 5m
          #                                           -----
          #                                            44m   against 50m
          #
          # Both are well above what a healthy lane needs: the operator install
          # took 7m and the operands were ready immediately on the machine this
          # was developed against.
          MOKKA_HELM_TIMEOUT: 12m
          MOKKA_READY_TIMEOUT: "300"
        run: make e2e-mokka MOKKA_PROFILE="${MOKKA_PROFILE}"

      # The lane is deleted by the make target as soon as the suite returns, so
      # the pod list, the events and the kind logs are collected by that target
      # while the cluster is still up. This step only ships what it left behind.
      # hack/mokka/bin holds the lane's kubeconfig and is never uploaded.
      # Cancelled as well as failed: a run cancelled by the concurrency group
      # above, or by the job timeout, is exactly when the dump is worth having,
      # and failure() alone does not cover either.
      - name: Upload the diagnostics of a failed lane
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-mokka-${{ matrix.profile }}-diagnostics
          path: bin/e2e-diagnostics-mokka/
          if-no-files-found: warn
          retention-days: 7
