#
# Runs the topology suite against the compute domain lane: a five node kind
# cluster whose four workers are split into two NVLink cliques, with the GPU
# Operator and Kueue on top. It is the only job that exercises
# "kubectl nv topology" against a cluster that has a fabric to report.
#
# Nightly and on demand, not on pull requests. The lane is twice the cluster
# of the e2e Mokka job and installs a third chart, so it is paid for once a
# day rather than once a push.
#
# Neither trigger fires from a branch. GitHub reads schedule and
# workflow_dispatch only from the copy of this file on the DEFAULT branch, so
# nothing here runs at all until this lands on main, and the pull request that
# adds it cannot demonstrate it. Once it is on main, workflow_dispatch can be
# pointed at any branch and will run that branch's code with this file's
# triggers.
#
# Every action is pinned to a commit, not to a tag: a tag is moved by whoever
# owns the action, and this job has a checkout and a Docker daemon in reach.

name: e2e compute domain

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the top of an hour is when every
    # other project's nightly queues, and a runner that waits an hour for a
    # slot turns a 50 minute budget into a cancelled job.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One lane at a time. Two runs would each create their own kind cluster on
# their own runner, so they cannot collide, but a queue of nightlies for
# commits nobody is waiting on any more pays for all of them.
concurrency:
  group: e2e-compute-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-domain:
    name: topology on a two clique lane
    runs-on: ubuntu-latest
    # A cold run pulls the node image on five nodes, the nvml-mock chart, the
    # GPU Operator images on four workers, and Kueue, before the suite starts.
    # The lane's own waits have to fit inside this with room to spare, or the
    # job is killed mid-install and reports a timeout instead of whichever
    # wait actually ran out.
    #
    # MOKKA_READY_TIMEOUT is the budget of ONE wait, and up.sh arms a fresh
    # deadline for each, so the worst case is the sum of four of them rather
    # than one shared 420s:
    #
    #   helm nvml-mock                                   12m
    #   helm gpu-operator                                12m
    #   420s operand DaemonSet rollout                    7m
    #   420s fabric assertions on four workers            7m
    #   420s Kueue controller rollout                     7m
    #   420s Kueue Topology/ResourceFlavor apply retry    7m
    #   runner setup, kind create, image pulls         about 8m
    #   suite, teardown and the diagnostics dump       about 5m
    #                                                   -----
    #                                                    65m   against 75m
    #
    # Every one of those waits is well above what a healthy lane needs. They
    # are the budget for a lane that is failing slowly, which is the case this
    # job has to survive long enough to collect diagnostics for.
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job reads this branch's own code and runs it. It has no reason
          # to hold a credential that can write to the repository.
          persist-credentials: false

      - name: Get Golang version
        id: go_version
        run: |
          GOLANG_VERSION=$(./hack/golang-version.sh)
          echo "GOLANG_VERSION=${GOLANG_VERSION##GOLANG_VERSION := }" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.go_version.outputs.GOLANG_VERSION }}

      - name: Install kind
        env:
          # The release the Mokka node image's base, kindest/node:v1.35.0, is
          # built and tested against. The same pin as the e2e Mokka job: the
          # two lanes share a node image, and a kind that works for one and
          # not the other would be a confusing way to find that out.
          KIND_VERSION: v0.31.0
          # The digest of that release's linux-amd64 binary, written out here
          # rather than fetched. A checksum file downloaded next to the binary
          # it describes is signed by nothing and served by whoever served the
          # binary, so it cannot witness for it; this line is reviewed, and a
          # binary that stops matching it stops the job.
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "${workdir}"
          # --retry, because a nightly that dies on one flaky release fetch
          # wastes a whole day. The digest below is what makes retrying safe:
          # whatever comes back is checked before it is installed.
          curl -fsSLo kind --retry 5 --retry-delay 5 --retry-all-errors \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          # The binary creates the cluster everything after it trusts, so it is
          # checked before it is installed, not after.
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned rather than "latest": the lane scripts are verified against
          # this release, and a helm that changes under them turns an unrelated
          # run red.
          version: v4.3.0

      - name: Report the runner's disk and memory
        run: |
          df -h
          free -m

      # The lane scripts and their fakes, before anything slow runs. They need
      # no cluster, so a lane that is broken in a way the fakes can see is
      # reported in seconds rather than after the cluster is up.
      - name: Test the lane scripts
        run: bash hack/mokka/compute-domain/up_test.sh

      # Before anything that takes a cluster. The suite is behind two build
      # tags, so a compile error in it is invisible to every other job in this
      # repository and would otherwise surface forty minutes from now, with
      # the lane already up.
      - name: Vet the compute domain suite
        run: go vet -tags e2e,computedomain ./test/e2e/...

      - name: Build kubectl-nv
        run: make build

      - name: Bring the compute domain lane up
        env:
          MOKKA_HELM_TIMEOUT: 12m
          # Higher than the e2e Mokka job's 300: this lane waits for operands
          # on four workers rather than two, and the assertion loop after them
          # also waits for GPU Feature Discovery to settle on a clique.
          MOKKA_READY_TIMEOUT: "420"
        run: hack/mokka/compute-domain/up.sh

      - name: Run the topology suite against the lane
        env:
          # Absolute paths: go test runs the test binary with the package
          # directory as its working directory, so a relative one resolves
          # somewhere this job did not mean.
          KUBECONFIG: ${{ github.workspace }}/hack/mokka/bin/kubeconfig-compute-domain
          KUBECTL_NV_BIN: ${{ github.workspace }}/bin/kubectl-nv
        run: |
          # The computedomain tag adds this lane's tests to the suite, it does
          # not replace it: the must-gather and exit-code tests compile under
          # the e2e tag alone and belong to the two worker lane, where they are
          # already run. -run keeps this job to the tests this lane exists for.
          # hack/mokka/compute-domain/up_test.sh checks that every test in
          # topology_test.go matches one of these three prefixes, so a test
          # added there cannot be silently skipped here.
          go test -tags e2e,computedomain -count=1 -timeout 30m \
            -run '^(TestTopology|TestJobNeeding|TestKueueLevels)' \
            ./test/e2e/...

      # Collected while the cluster is still up, which is why this runs before
      # the teardown and not after it. Cancelled as well as failed: a run
      # cancelled by the concurrency group above, or by the job timeout, is
      # exactly when the dump is worth having, and failure() alone covers
      # neither.
      - name: Collect the lane's diagnostics
        if: failure() || cancelled()
        env:
          KUBECONFIG: ${{ github.workspace }}/hack/mokka/bin/kubeconfig-compute-domain
          CONTEXT: kind-kubectl-nv-compute-domain
          DIAG: ${{ github.workspace }}/bin/e2e-diagnostics-compute-domain
        run: |
          set -u
          mkdir -p "${DIAG}"
          kubectl --context "${CONTEXT}" get nodes -o yaml > "${DIAG}/nodes.yaml" 2>&1 || true
          kubectl --context "${CONTEXT}" get pods -A -o wide > "${DIAG}/pods.txt" 2>&1 || true
          kubectl --context "${CONTEXT}" get events -A --sort-by=.lastTimestamp \
            > "${DIAG}/events.txt" 2>&1 || true
          kubectl --context "${CONTEXT}" get topologies.kueue.x-k8s.io,resourceflavors.kueue.x-k8s.io \
            -o yaml > "${DIAG}/kueue.yaml" 2>&1 || true
          kubectl --context "${CONTEXT}" get jobs -A -o yaml > "${DIAG}/jobs.yaml" 2>&1 || true

          # The two things that say why a clique label is wrong. GFD does not
          # write node labels directly: it publishes a NodeFeature and
          # nfd-master applies it, so the NodeFeature is what GFD actually
          # reported and the node is only where it ended up. The GFD pod's
          # environment says whether NRI reached it: NODE_NAME and
          # MOCK_TOPOLOGY_CONFIG present means it resolved this lane's
          # cliques, absent means it resolved the gb200 placeholder and
          # overwrote the kind config's static labels with it.
          kubectl --context "${CONTEXT}" get nodefeatures.nfd.k8s-sigs.io -A -o yaml \
            > "${DIAG}/nodefeatures.yaml" 2>&1 || true
          for pod in $(kubectl --context "${CONTEXT}" -n gpu-operator get pods \
            -l app=gpu-feature-discovery -o name 2>/dev/null || true); do
            {
              echo "=== ${pod} env as the pod spec declares it ==="
              kubectl --context "${CONTEXT}" -n gpu-operator get "${pod}" \
                -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{range .env[*]}  {.name}={.value}{"\n"}{end}{end}'
              echo
              echo "=== ${pod} env as the process sees it, NRI edits included ==="
              kubectl --context "${CONTEXT}" -n gpu-operator exec "${pod}" -- env
            } >> "${DIAG}/gfd-env.txt" 2>&1 || true
          done

          # Disk and image space. Five kind nodes plus the GPU Operator images
          # is the usual way a runner runs out, and the failure that produces
          # reads as an unrelated timeout.
          df -h > "${DIAG}/df.txt" 2>&1 || true
          docker system df -v > "${DIAG}/docker-df.txt" 2>&1 || true

          kind export logs "${DIAG}/kind" --name kubectl-nv-compute-domain \
            > "${DIAG}/kind-export.txt" 2>&1 || true

      # always(), so a cancelled or failed run does not leave a five node
      # cluster behind on a self-hosted runner, and so a green run tears down
      # exactly once.
      - name: Tear the lane down
        if: always()
        run: hack/mokka/compute-domain/down.sh || true

      # hack/mokka/bin holds the lane's kubeconfig and is never uploaded.
      - name: Upload the diagnostics of a failed lane
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compute-domain-diagnostics
          path: bin/e2e-diagnostics-compute-domain/
          if-no-files-found: warn
          retention-days: 7
