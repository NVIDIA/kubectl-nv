# An IMEX daemon pod that never becomes ready, for the NV-CD-001 reproduction.
#
# The DRA driver's IMEX daemon carries no "app" label at all: upstream labels
# it only with resource.nvidia.com/computeDomain, and pkg/inventory maps that
# onto the compute-domain-daemon component. The label's value is the domain's
# UID upstream; nothing here reads the value, only the key.
apiVersion: v1
kind: Pod
metadata:
  name: nv-faults-imex-daemon
  namespace: __NAMESPACE__
  labels:
    resource.nvidia.com/computeDomain: nv-faults-compute-domain
    nv.example/faults-fixture: "nv-cd-001"
spec:
  nodeName: __NODE__
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  tolerations:
    - operator: Exists
  containers:
    - name: compute-domain-daemon
      image: registry.invalid/nv-faults/imex:v0.0.0-absent
      imagePullPolicy: Always
