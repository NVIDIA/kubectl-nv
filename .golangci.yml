version: "2"
# The end to end suite is behind the "e2e" build tag. Without it here the
# linter skips those files entirely, so the only code that talks to a real
# cluster would be the only code nobody checks.
run:
  build-tags:
    - e2e
linters:
  disable:
    - errcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
